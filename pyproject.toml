[project]
name = "bramka-poczty"
version = "0.1.0"
description = "Bramka MCP między agentem a Gmailem (IMAP): przepuszcza działania odwracalne, blokuje nieodwracalne"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2",
    "imapclient>=3",
    "uvicorn>=0.30",
]

[project.scripts]
bramka = "bramka.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bramka"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
